name: Build HC5962 SPI 32MB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'files/**'

permissions:
  contents: read

concurrency:
  group: hc5962-spi-32m-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WORK_DIR: ${{ github.workspace }}/work
      OUTPUT_DIR: ${{ github.workspace }}/artifacts
      JOBS: '2'
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the disposable GitHub-hosted runner
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # These fixed paths contain preinstalled SDKs on this disposable runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd patch perl libelf-dev
          df -h .

      - name: Build the pinned OpenWrt sources and matching mt76 driver
        shell: bash
        timeout-minutes: 320
        run: bash scripts/build.sh

      - name: Upload firmware and checksums
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hc5962-spi-32m-${{ github.run_number }}
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload logs and source provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hc5962-spi-32m-logs-${{ github.run_number }}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
